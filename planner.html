    <body>

        <div style="background-color: #9f8170; border: 2px solid #9f8170; margin-bottom: 25px; text-align: center;">
            <h1 style="font-family: 'Tangerine', cursive; color: #E9E4D4;">

        <div style="display:flex; gap: 10px; margin-bottom: 25px;">
           <input type="text" placeholder="Enter date... " style="border:4px solid #9f8170; font-family: 'Coming Soon', cursive; color: #4c2f21;">
           <input type="text" placeholder="Any occasions today?..." style="border: 4px solid #9f8170; font-family: 'Coming Soon', cursive; color: #4c2f21;">
        </div>
        <div style="display:flex; gap: 10px; margin-bottom: 25px;">
            <div style="border:5px solid #9f8170; max-width: 200px; background-color: #ffffff;">
            <h2 style="font-family: 'Mali', cursive; font-weight: 700; color: #4c2f21;">PLANNER</h2>
            <p style="text-align: center; color: #4c2f21; font-family: Coming Soon;">What are your plans for today?</p>
     
     <label>
         <input type="checkbox">
         <input type="text" placeholder="Add text..." style="color: #4c2f21; border: 0px; font-family: 'Patrick Hand', cursive;">
     </label>
<br>
    <label>
        <input type="checkbox">   
        <input type="text" placeholder="Add text..." style="color: #4c2f21; border: 0px; font-family: 'Patrick Hand', cursive;">
    </label>
<br>
    <label>
        <input type="checkbox">
        <input type="text" placeholder="Add text..." style="color: #4c2f21; border: 0px; font-family: 'Patrick Hand', cursive;">
    </label>
           </div>
           <div style="border: 5px solid #9f8170; max-width: 200px; background-color: #ffffff;">
            <h2 style="font-family: 'Mali', cursive; font-weight: 700; color: #4c2f21;">JOURNAL</h2>
            <p style="text-align: center; color: #4c2f21; font-family: Coming Soon;">What are your insights this day?</p>
            <textarea placeholder="Add text..." style="border: 0px; color: #4c2f21; font-family: 'Patrick Hand', cursive; margin: 10px;#ff4900"></textarea>
          </div>
      </div>
      <div style="border: 5px solid #9f8170; max-width: 200px; background-color: #ffffff; max-width: 100%;">
          <h3 style="font-family: 'Mali', cursive; font-weight: 700; color: #4c2f21;">MOOD TRACKER</h3>
          <p style="color: #4c2f21; font-family: Coming Soon;">How are you feeling today?</p>
          <input type="radio" name="mood" id="mood-happy" value="😃 Happy" class="mood-radio">
        <label for="mood-happy" class="mood-pill" style="font-family: 'Patrick Hand', cursive;">😃 Happy</label>

        <input type="radio" name="mood" id="mood-sad" value="☹️ Sad" class="mood-radio">
        <label for="mood-sad" class="mood-pill" style="font-family: 'Patrick Hand', cursive;">☹️ Sad</label>

        <input type="radio" name="mood" id="mood-pressuredstressed" value="😭 Pressured/Stressed" class="mood-radio">
        <label for="mood-pressuredstressed" class="mood-pill" style="font-family: 'Patrick Hand', cursive;">😭 Pressured/Stressed</label>
<br>
        <input type="radio" name="mood" id="mood-angry" value="😡 Angry" class="mood-radio">
        <label for="mood-angry" class="mood-pill" style="font-family: 'Patrick Hand', cursive;">😡 Angry</label>
        <input type="radio" name="mood" id="mood-anxious" value="😐 Skeptical/In shock" class="mood-radio">
        <label for="mood-anxious" class="mood-pill" style="font-family: 'Patrick Hand', cursive;">😐 Skeptical/In shock</label>
        <input type="radio" name="mood" id="mood-sleepy" value="🥱 Sleepy" class="mood-radio">
        <label for="mood-sleepy" class="mood-pill" style="font-family: 'Patrick Hand', cursive;">🥱 Sleepy</label>
        <br>
        <input type="radio" name="mood" id="mood-other" value="Other" class="mood-radio"/>
        <label for="mood-other" class="mood-pill" style="font-family: 'Patrick Hand', cursive;"><input type="text" placeholder="Other..." style="margin-bottom: 25px; font-family: 'Patrick Hand', cursive;"></label>
